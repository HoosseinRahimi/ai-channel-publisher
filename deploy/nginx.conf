# =============================================================================
# VerborgeneSchicht Publisher — Nginx TLS reverse proxy
# Ubuntu/Debian layout: copy to /etc/nginx/sites-available and symlink it.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/verborgene-schicht
#   sudo ln -s /etc/nginx/sites-available/verborgene-schicht /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then enable the in-process scheduler so publication runs without an external
# cron (set ENABLE_INPROCESS_SCHEDULER=true in the app's environment).
# =============================================================================

server {
    listen 80;
    server_name publisher.example.com;                  # <-- your domain

    # Redirect HTTP → HTTPS (letsencrypt will need a temporary port-80 block
    # during issuance; keep this and use `certbot --nginx`).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name publisher.example.com;                  # <-- your domain

    # --- TLS --------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/publisher.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/publisher.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # --- Upstream ----------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Server POSTs JSON bodies; keep a generous ceiling for file uploads.
        client_max_body_size 50m;
    }

    # --- Health (optionally expose for a load balancer / uptime probe) -----------
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
    }
}